
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>全功能匿名聊天室</title>
<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
<style>
  :root {
    --primary: #07c160; --bg: #ededed; --text: #333;
    --bubble-me: #95ec69; --bubble-other: #fff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, 'PingFang SC', sans-serif; }
  body { background: var(--bg); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

  /* 登录设置界面 */
  #login-view {
    position: fixed; inset: 0; background: #fff; z-index: 100;
    display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px;
  }
  .avatar-upload {
    width: 100px; height: 100px; border-radius: 50%; background: #eee;
    display: flex; justify-content: center; align-items: center; overflow: hidden;
    cursor: pointer; margin-bottom: 20px; border: 2px solid #ddd; position: relative;
  }
  .avatar-upload img { width: 100%; height: 100%; object-fit: cover; display: none; }
  .avatar-upload span { font-size: 30px; color: #aaa; }
  .input-group { width: 100%; max-width: 300px; margin-bottom: 15px; }
  .input-group input {
    width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; outline: none;
  }
  .btn {
    width: 100%; max-width: 300px; padding: 12px; background: var(--primary); color: #fff;
    border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer;
  }

  /* 聊天主界面 */
  #chat-view { display: none; flex-direction: column; height: 100%; width: 100%; max-width: 600px; margin: 0 auto; background: var(--bg); box-shadow: 0 0 20px rgba(0,0,0,0.1); position: relative; }
  
  /* 顶部导航 */
  .header { background: #f7f7f7; padding: 10px 15px; display: flex; flex-direction: column; border-bottom: 1px solid #ddd; position: relative; gap: 10px; }
  .header-top { display: flex; justify-content: space-between; align-items: center; }
  .header-title { font-weight: bold; font-size: 16px; display: flex; align-items: center; gap: 8px; }
  
  /* 状态指示灯 */
  .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #f00; transition: background 0.3s; }
  .status-dot.online { background: var(--primary); }

  #online-badge {
    font-size: 12px; background: #e6f7eb; color: var(--primary); padding: 2px 8px; border-radius: 10px;
    font-weight: normal; cursor: pointer; border: 1px solid var(--primary);
  }
  .my-info { display: flex; align-items: center; gap: 8px; font-size: 14px; color: #666; cursor: pointer; }
  .my-info img { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; border: 1px solid #ccc; }
  
  .search-bar { display: flex; width: 100%; }
  .search-bar input {
    flex: 1; padding: 8px 12px; border: 1px solid #ddd; border-radius: 15px;
    font-size: 13px; outline: none; background: #fff;
  }

  /* 在线列表弹窗 */
  #online-list-popup {
    position: absolute; top: 60px; left: 15px; background: #fff; border-radius: 8px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.15); width: 200px; max-height: 300px;
    overflow-y: auto; display: none; z-index: 50; padding: 10px 0;
  }
  #online-list-popup.show { display: block; }
  .online-user-item {
    display: flex; align-items: center; gap: 10px; padding: 8px 15px; font-size: 14px;
    cursor: pointer; transition: background 0.2s;
  }
  .online-user-item:hover { background: #f0f0f0; }
  .online-user-item img { width: 25px; height: 25px; border-radius: 50%; object-fit: cover; }
  .online-user-item span { color: #333; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* 消息列表 */
  #messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 15px; }
  .msg-row { display: flex; align-items: flex-start; gap: 10px; }
  .msg-row.me { flex-direction: row-reverse; }
  .msg-avatar { width: 40px; height: 40px; border-radius: 5px; object-fit: cover; background: #ccc; cursor: pointer; }
  .msg-content { max-width: 70%; display: flex; flex-direction: column; }
  .msg-row.me .msg-content { align-items: flex-end; }
  .msg-name { font-size: 12px; color: #999; margin-bottom: 4px; display: flex; align-items: center; gap: 5px; }
  .ip-tag { font-size: 10px; background: #f0f0f0; color: #888; padding: 1px 4px; border-radius: 4px; border: 1px solid #ddd; }
  .msg-bubble {
    padding: 10px 14px; border-radius: 8px; font-size: 16px; line-height: 1.4; word-break: break-all;
    background: var(--bubble-other); color: var(--text); position: relative;
  }
  .msg-row.me .msg-bubble { background: var(--bubble-me); }
  .msg-bubble img { max-width: 100%; border-radius: 5px; display: block; }

  /* 底部输入区 */
  .footer { background: #f7f7f7; padding: 10px 15px; border-top: 1px solid #ddd; }
  .chat-tools { display: flex; gap: 10px; margin-bottom: 8px; font-size: 13px; color: #666; overflow-x: auto; }
  .chat-tools span { cursor: pointer; padding: 4px 10px; border-radius: 10px; background: #e0e0e0; white-space: nowrap; }
  .chat-tools span.active { background: var(--primary); color: #fff; }
  
  .input-area { display: flex; gap: 8px; align-items: center; }
  .input-area input[type="text"] { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 8px; outline: none; }
  .icon-btn { font-size: 24px; cursor: pointer; user-select: none; padding: 0 5px; }
  .send-btn { padding: 0 15px; height: 40px; background: var(--primary); color: #fff; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }

  /* 通用弹窗 */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 200;
    display: none; justify-content: center; align-items: center;
  }
  .modal-overlay.show { display: flex; }
  .modal-content {
    background: #fff; border-radius: 12px; padding: 20px; width: 80%; max-width: 320px;
    display: flex; flex-direction: column; align-items: center;
  }
  .modal-content h3 { margin-bottom: 15px; color: #333; font-size: 18px; }
</style>
</head>
<body>

  <!-- 登录页 -->
  <div id="login-view">
    <div class="avatar-upload" onclick="document.getElementById('file-input').click()">
      <span id="avatar-icon">+</span>
      <img id="avatar-preview" src="" alt="avatar">
    </div>
    <input type="file" id="file-input" accept="image/*" style="display: none;" onchange="handleAvatar(event, 'login')">
    
    <div class="input-group">
      <input type="text" id="name-input" placeholder="请输入你的昵称" maxlength="10">
    </div>
    <button class="btn" onclick="enterChat()">进入聊天室</button>
  </div>

  <!-- 修改资料弹窗 -->
  <div class="modal-overlay" id="settings-modal">
    <div class="modal-content">
      <h3>修改个人资料</h3>
      <div class="avatar-upload" style="width: 80px; height: 80px; margin-bottom: 15px;" onclick="document.getElementById('file-input-edit').click()">
        <img id="avatar-preview-edit" src="" style="display: block;">
      </div>
      <input type="file" id="file-input-edit" accept="image/*" style="display: none;" onchange="handleAvatar(event, 'edit')">
      <div class="input-group" style="margin-bottom: 20px;">
        <input type="text" id="name-input-edit" placeholder="修改昵称" maxlength="10">
      </div>
      <div style="display: flex; gap: 10px; width: 100%;">
        <button class="btn" style="background: #ccc; flex: 1;" onclick="document.getElementById('settings-modal').classList.remove('show')">取消</button>
        <button class="btn" style="flex: 1;" onclick="saveSettings()">保存</button>
      </div>
    </div>
  </div>

  <!-- 聊天页 -->
  <div id="chat-view">
    <div class="header">
      <div class="header-top">
        <div class="header-title">
          <div class="status-dot" id="status-dot" title="未连接"></div>
          <span>聊天室</span>
          <span id="online-badge" onclick="toggleOnlineList(event)">在线: 0</span>
        </div>
        <div class="my-info" onclick="openSettings()">
          <span id="my-name-display"></span>
          <img id="my-avatar-display" src="" alt="">
        </div>
      </div>
      <div class="search-bar">
        <input type="text" id="search-input" placeholder="🔍 搜索聊天记录..." oninput="searchMessages()">
      </div>
      <div id="online-list-popup"></div>
    </div>

    <div id="messages"></div>

    <div class="footer">
      <div class="chat-tools">
        <span class="active" id="tool-global" onclick="setChatMode('global')">🌍 世界</span>
        <span id="tool-private" onclick="setChatMode('private')">🔒 私聊</span>
        <span onclick="matchGame()">🎮 猜拳</span>
      </div>
      <div class="input-area">
        <div class="icon-btn" onclick="document.getElementById('img-input').click()">📷</div>
        <input type="file" id="img-input" accept="image/*" style="display: none;" onchange="sendImage(event)">
        
        <input type="text" id="msg-input" placeholder="说点什么..." onkeydown="if(event.key==='Enter') sendMsg()">
        <button class="send-btn" onclick="sendMsg()">发送</button>
      </div>
    </div>
  </div>

<script>
  let myAvatarBase64 = '';
  let myName = '';
  let myId = Math.random().toString(36).substring(2, 8);
  let myIpLocation = '未知';
  let privateTarget = null;
  let chatMode = 'global';
  
  let client = null;
  const TOPIC = 'github_pages_chat_room_999';
  const PRESENCE_TOPIC = TOPIC + '/presence';
  const onlineUsers = new Map();
  
  let chatHistory = [];
  const MAX_HISTORY = 100;

  window.onload = () => {
    loadLocalData();
    fetchIpLocation();
  };

  function loadLocalData() {
    const savedUser = localStorage.getItem('chat_user_info');
    if (savedUser) {
      const user = JSON.parse(savedUser);
      myName = user.name;
      myAvatarBase64 = user.avatar;
      myId = user.id;
      if(myAvatarBase64) {
        document.getElementById('avatar-icon').style.display = 'none';
        const img = document.getElementById('avatar-preview');
        img.src = myAvatarBase64; img.style.display = 'block';
      }
      if(myName) document.getElementById('name-input').value = myName;
    }
    const savedHistory = localStorage.getItem('chat_history');
    if (savedHistory) chatHistory = JSON.parse(savedHistory);
  }

  function saveLocalData() {
    localStorage.setItem('chat_user_info', JSON.stringify({ name: myName, avatar: myAvatarBase64, id: myId }));
  }

  function saveHistoryToLocal() {
    if (chatHistory.length > MAX_HISTORY) chatHistory.shift();
    localStorage.setItem('chat_history', JSON.stringify(chatHistory));
  }

  function fetchIpLocation() {
    fetch('https://api.vore.top/api/IPdata')
      .then(res => res.json())
      .then(data => {
        if(data.ipdata && data.ipdata.info1) myIpLocation = data.ipdata.info1.replace('省', '').replace('市', '');
      }).catch(() => {});
  }

  function handleAvatar(e, mode) {
    const file = e.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = function(evt) {
        // 压缩头像
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          canvas.width = 100; canvas.height = 100;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, 100, 100);
          const base64 = canvas.toDataURL('image/jpeg', 0.8);

          if(mode === 'login') {
            myAvatarBase64 = base64;
            document.getElementById('avatar-icon').style.display = 'none';
            const preview = document.getElementById('avatar-preview');
            preview.src = myAvatarBase64; preview.style.display = 'block';
          } else {
            document.getElementById('avatar-preview-edit').src = base64;
            document.getElementById('avatar-preview-edit').dataset.newAvatar = base64;
          }
        };
        img.src = evt.target.result;
      };
      reader.readAsDataURL(file);
    }
  }

  function openSettings() {
    document.getElementById('name-input-edit').value = myName;
    document.getElementById('avatar-preview-edit').src = myAvatarBase64;
    document.getElementById('avatar-preview-edit').dataset.newAvatar = myAvatarBase64;
    document.getElementById('settings-modal').classList.add('show');
  }

  function saveSettings() {
    const newName = document.getElementById('name-input-edit').value.trim();
    const newAvatar = document.getElementById('avatar-preview-edit').dataset.newAvatar;
    if(newName) myName = newName;
    if(newAvatar) myAvatarBase64 = newAvatar;
    
    document.getElementById('my-name-display').innerText = myName;
    document.getElementById('my-avatar-display').src = myAvatarBase64;
    document.getElementById('settings-modal').classList.remove('show');
    saveLocalData();
    sendHeartbeat();
  }

  function enterChat() {
    myName = document.getElementById('name-input').value.trim();
    if (!myName) return alert("请输入昵称！");
    if (!myAvatarBase64) return alert("请上传头像！");
    saveLocalData();
    
    document.getElementById('login-view').style.display = 'none';
    document.getElementById('chat-view').style.display = 'flex';
    document.getElementById('my-name-display').innerText = myName;
    document.getElementById('my-avatar-display').src = myAvatarBase64;

    chatHistory.forEach(msg => addMessageToUI(msg, msg.senderId === myId));

    // 连接 MQTT (加入重连机制)
    const host = 'wss://broker.emqx.io:8084/mqtt';
    client = mqtt.connect(host, { 
      clientId: 'user_' + myId,
      keepalive: 30,
      reconnectPeriod: 2000 // 断线2秒后自动重连
    });

    client.on('connect', () => {
      document.getElementById('status-dot').classList.add('online');
      document.getElementById('status-dot').title = "已连接";
      client.subscribe(TOPIC);
      client.subscribe(PRESENCE_TOPIC);
      sendHeartbeat();
      setInterval(sendHeartbeat, 5000);
      setInterval(cleanOfflineUsers, 10000);
    });

    client.on('offline', () => {
      document.getElementById('status-dot').classList.remove('online');
      document.getElementById('status-dot').title = "连接断开，正在重连...";
    });

    client.on('error', (err) => {
      console.log("MQTT Error: ", err);
      document.getElementById('status-dot').classList.remove('online');
    });

    client.on('message', (topic, payload) => {
      try {
        const data = JSON.parse(payload.toString());
        if (data.senderId === myId) return; // 过滤自己

        if (topic === PRESENCE_TOPIC) {
          handlePresence(data); return;
        }

        if (data.isPrivate && data.targetId !== myId) return; // 过滤非我私聊
        
        chatHistory.push(data);
        saveHistoryToLocal();
        
        if(!document.getElementById('search-input').value) {
          addMessageToUI(data, false);
        }
      } catch(e) { console.log("消息解析错误", e); }
    });
  }

  function sendMsg() {
    if (!client || !client.connected) return alert("网络正在重连，请稍后再试！");
    const input = document.getElementById('msg-input');
    const text = input.value.trim();
    if (!text) return;

    if (chatMode === 'private' && !privateTarget) return alert("请选择私聊对象！");

    const msgData = {
      type: 'text', content: text,
      senderId: myId, senderName: myName, senderAvatar: myAvatarBase64, ipLocation: myIpLocation,
      isPrivate: chatMode === 'private',
      targetId: chatMode === 'private' ? privateTarget.id : null,
      targetName: chatMode === 'private' ? privateTarget.name : null
    };

    client.publish(TOPIC, JSON.stringify(msgData));
    chatHistory.push(msgData);
    saveHistoryToLocal();
    addMessageToUI(msgData, true);
    input.value = '';
  }

  function sendImage(e) {
    if (!client || !client.connected) return alert("网络正在重连，请稍后再试！");
    const file = e.target.files[0];
    if (!file) return;
    
    const reader = new FileReader();
    reader.onload = (evt) => {
      const img = new Image();
      img.onload = () => {
        // 极致压缩到最大宽高 400px，防止超出 MQTT 限制导致断线
        const canvas = document.createElement('canvas');
        let scale = Math.min(400 / img.width, 400 / img.height, 1);
        canvas.width = img.width * scale;
        canvas.height = img.height * scale;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        
        const base64Img = canvas.toDataURL('image/jpeg', 0.5); // 质量降到0.5

        const msgData = {
          type: 'image', content: base64Img,
          senderId: myId, senderName: myName, senderAvatar: myAvatarBase64, ipLocation: myIpLocation,
          isPrivate: chatMode === 'private',
          targetId: chatMode === 'private' ? privateTarget.id : null
        };
        
        client.publish(TOPIC, JSON.stringify(msgData));
        chatHistory.push(msgData);
        saveHistoryToLocal();
        addMessageToUI(msgData, true);
      };
      img.src = evt.target.result;
    };
    reader.readAsDataURL(file);
    e.target.value = ''; 
  }

  function addMessageToUI(data, isMe) {
    const msgContainer = document.getElementById('messages');
    const div = document.createElement('div');
    div.className = `msg-row ${isMe ? 'me' : ''}`;
    
    const avatarClick = isMe ? '' : `onclick="setPrivate('${data.senderId}', '${data.senderName}')"`;
    let privateTag = data.isPrivate ? '[私聊]' : '';
    let ipTag = data.ipLocation && !isMe ? `<span class="ip-tag">${data.ipLocation}</span>` : '';
    
    let contentHtml = data.type === 'image' ? `<img src="${data.content}">` : data.content;

    div.innerHTML = `
      <img class="msg-avatar" src="${data.senderAvatar}" ${avatarClick}>
      <div class="msg-content">
        <div class="msg-name">${isMe ? '' : data.senderName} ${privateTag} ${ipTag}</div>
        <div class="msg-bubble">${contentHtml}</div>
      </div>
    `;
    msgContainer.appendChild(div);
    msgContainer.scrollTop = msgContainer.scrollHeight;
  }

  function searchMessages() {
    const keyword = document.getElementById('search-input').value.toLowerCase();
    const msgContainer = document.getElementById('messages');
    msgContainer.innerHTML = ''; 
    
    if(!keyword) {
      chatHistory.forEach(msg => addMessageToUI(msg, msg.senderId === myId));
      return;
    }

    chatHistory.forEach(msg => {
      if(msg.type === 'text' && msg.content.toLowerCase().includes(keyword)) {
        addMessageToUI(msg, msg.senderId === myId);
      } else if(msg.type === 'image' && keyword === '图片') {
        addMessageToUI(msg, msg.senderId === myId);
      }
    });
  }

  function sendHeartbeat() {
    if (!client || !client.connected) return;
    client.publish(PRESENCE_TOPIC, JSON.stringify({
      type: 'heartbeat', senderId: myId, senderName: myName, senderAvatar: myAvatarBase64
    }));
    onlineUsers.set(myId, { name: myName, avatar: myAvatarBase64, lastSeen: Date.now() });
    updateOnlineUI();
  }

  function handlePresence(data) {
    if (data.senderId === myId) return;
    if (data.type === 'heartbeat') {
      onlineUsers.set(data.senderId, { name: data.senderName, avatar: data.senderAvatar, lastSeen: Date.now() });
      updateOnlineUI();
    } else if (data.type === 'offline') {
      onlineUsers.delete(data.senderId); updateOnlineUI();
    }
  }

  function cleanOfflineUsers() {
    let changed = false;
    const now = Date.now();
    onlineUsers.forEach((user, id) => {
      if (now - user.lastSeen > 12000) { onlineUsers.delete(id); changed = true; }
    });
    if (changed) updateOnlineUI();
  }

  window.addEventListener('beforeunload', () => {
    if (client && client.connected) {
      client.publish(PRESENCE_TOPIC, JSON.stringify({ type: 'offline', senderId: myId }));
    }
  });

  function updateOnlineUI() {
    const count = onlineUsers.size;
    document.getElementById('online-badge').innerText = `在线: ${count}`;
    const popup = document.getElementById('online-list-popup');
    popup.innerHTML = '';
    onlineUsers.forEach((user, id) => {
      const item = document.createElement('div');
      item.className = 'online-user-item';
      item.onclick = (e) => { e.stopPropagation(); if (id !== myId) { setPrivate(id, user.name); toggleOnlineList(); } };
      item.innerHTML = `<img src="${user.avatar}"><span>${user.name} ${id === myId ? '(我)' : ''}</span>`;
      popup.appendChild(item);
    });
  }

  function toggleOnlineList(e) {
    if (e) e.stopPropagation();
    document.getElementById('online-list-popup').classList.toggle('show');
  }
  document.addEventListener('click', () => { document.getElementById('online-list-popup').classList.remove('show'); });

  function setPrivate(id, name) {
    privateTarget = { id, name };
    setChatMode('private');
  }

  function setChatMode(mode) {
    chatMode = mode;
    document.getElementById('tool-global').classList.toggle('active', mode === 'global');
    document.getElementById('tool-private').classList.toggle('active', mode === 'private');
    document.getElementById('tool-private').innerText = `🔒 私聊 ${privateTarget ? `(${privateTarget.name})` : ''}`;
  }

  function matchGame() {
    if (!client || !client.connected) return alert("网络正在重连，请稍后再试！");
    const gameData = { type: 'game', action: 'start', senderId: myId, senderName: myName };
    client.publish(TOPIC, JSON.stringify(gameData));
    addMessageToUI({ type: 'text', content: '🎮 发起了猜拳邀请！', senderName: '系统', senderId: 'sys', senderAvatar: 'https://api.dicebear.com/7.x/bottts/svg?seed=sys', ipLocation: '' }, false);
  }
</script>
</body>
</html>
